name: Vercel Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vercel-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install Vercel CLI
        run: npm install --global vercel@latest
      - name: Pull and build preview artifacts
        if: github.event_name == 'pull_request'
        run: |
          vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"
          vercel build --token="$VERCEL_TOKEN"
      - name: Deploy to Vercel
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            URL="$(vercel deploy --prebuilt --token="$VERCEL_TOKEN")"
            echo "### Vercel Preview" >> "$GITHUB_STEP_SUMMARY"
          else
            URL="$(vercel deploy --prod --yes --token="$VERCEL_TOKEN")"
            echo "### Vercel Production" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "Deployed URL: $URL" >> "$GITHUB_STEP_SUMMARY"
          echo "Deployed URL: $URL"
