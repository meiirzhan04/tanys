name: Vercel Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vercel-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install Vercel CLI
        run: npm install --global vercel@latest
      - name: Pull and build preview artifacts
        if: github.event_name == 'pull_request'
        run: |
          vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"
          vercel build --token="$VERCEL_TOKEN"
      - name: Deploy to Vercel
        run: |
          set +e
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            vercel deploy --prebuilt --token="$VERCEL_TOKEN" >/tmp/deploy.out 2>/tmp/deploy.err
            STATUS=$?
            TITLE="### Vercel Preview"
          else
            vercel deploy --prod --yes --token="$VERCEL_TOKEN" >/tmp/deploy.out 2>/tmp/deploy.err
            STATUS=$?
            TITLE="### Vercel Production"
          fi
          set -e
          cat /tmp/deploy.err >&2
          cat /tmp/deploy.out
          if [ "$STATUS" -ne 0 ]; then
            if grep -q 'api-deployments-free-per-day' /tmp/deploy.err /tmp/deploy.out; then
              echo "$TITLE skipped: Vercel free daily deployment quota reached" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            exit "$STATUS"
          fi
          URL="$(tail -n 1 /tmp/deploy.out)"
          echo "$TITLE" >> "$GITHUB_STEP_SUMMARY"
          echo "Deployed URL: $URL" >> "$GITHUB_STEP_SUMMARY"
          echo "Deployed URL: $URL"
