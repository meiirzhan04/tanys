name: Vercel Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vercel-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install Vercel CLI
        run: npm install --global vercel@latest
      - name: Pull Vercel environment
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"
          else
            vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          fi
      - name: Build project artifacts
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            vercel build --token="$VERCEL_TOKEN"
          else
            vercel build --prod --token="$VERCEL_TOKEN"
          fi
      - name: Apply production database migrations
        if: github.event_name != 'pull_request'
        run: |
          node -e '
            const fs = require("node:fs");
            const { execFileSync } = require("node:child_process");
            if (!fs.existsSync(".vercel/.env.production.local")) process.exit(0);
            const raw = fs.readFileSync(".vercel/.env.production.local", "utf8");
            const env = { ...process.env };
            for (const line of raw.split(/\r?\n/)) {
              const m = line.match(/^([A-Z0-9_]+)=(.*)$/);
              if (!m) continue;
              let v = m[2].trim();
              if ((v.startsWith("\"") && v.endsWith("\"")) || (v.startsWith("\x27") && v.endsWith("\x27"))) v = v.slice(1, -1);
              env[m[1]] = v;
            }
            const dbUrl = env.DATABASE_URL_UNPOOLED || env.DATABASE_URL;
            if (!dbUrl) process.exit(0);
            execFileSync("node", ["server/dist/migrate.js"], { stdio: "inherit", env: { ...env, DATABASE_URL: dbUrl } });
          '
      - name: Deploy to Vercel
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            URL="$(vercel deploy --prebuilt --token="$VERCEL_TOKEN")"
            echo "### Vercel Preview" >> "$GITHUB_STEP_SUMMARY"
          else
            URL="$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")"
            echo "### Vercel Production" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "Deployed URL: $URL" >> "$GITHUB_STEP_SUMMARY"
          echo "Deployed URL: $URL"
