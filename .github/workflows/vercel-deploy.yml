name: Vercel Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vercel-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install Vercel CLI
        run: npm install --global vercel@latest
      - name: Deploy to Vercel
        run: |
          set +e
          vercel deploy --prod --yes --token="$VERCEL_TOKEN" >/tmp/deploy.out 2>/tmp/deploy.err
          STATUS=$?
          TITLE="### Vercel Production"
          set -e
          cat /tmp/deploy.err >&2
          cat /tmp/deploy.out
          if [ "$STATUS" -ne 0 ]; then
            if grep -q 'api-deployments-free-per-day' /tmp/deploy.err /tmp/deploy.out; then
              echo "$TITLE skipped: Vercel free daily deployment quota reached" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            exit "$STATUS"
          fi
          URL="$(tail -n 1 /tmp/deploy.out)"
          echo "$TITLE" >> "$GITHUB_STEP_SUMMARY"
          echo "Deployed URL: $URL" >> "$GITHUB_STEP_SUMMARY"
          echo "Deployed URL: $URL"
