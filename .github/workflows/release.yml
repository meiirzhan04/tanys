name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: Target environment
        type: choice
        options:
          - staging
          - production
        default: staging
      action:
        description: Release action
        type: choice
        options:
          - deploy
          - rollback
        default: deploy
      release_tag:
        description: Immutable image tag (git SHA) for production deploy or rollback
        type: string
        required: false

permissions:
  contents: read
  packages: write

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release_tag: ${{ steps.meta.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: node --experimental-strip-types tests/verify-matching.mjs
      - run: npm run build
      - working-directory: server
        run: npm ci --no-audit --no-fund && npm run build
      - id: meta
        run: |
          TAG="${{ inputs.release_tag || github.sha }}"
          echo "release_tag=${TAG}" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        if: inputs.action != 'rollback'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push web and api images
        if: inputs.action != 'rollback'
        run: |
          REPO="$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"
          TAG="${{ steps.meta.outputs.release_tag }}"
          docker build -t "ghcr.io/${REPO}-web:${TAG}" .
          docker build -t "ghcr.io/${REPO}-api:${TAG}" ./server
          docker push "ghcr.io/${REPO}-web:${TAG}"
          docker push "ghcr.io/${REPO}-api:${TAG}"

  deploy-staging:
    needs: verify-and-build
    if: github.event_name == 'push' || inputs.target == 'staging'
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Deploy or rollback staging over SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_DIR: ${{ secrets.DEPLOY_DIR }}
          RELEASE_ACTION: ${{ inputs.action || 'deploy' }}
          RELEASE_TAG: ${{ needs.verify-and-build.outputs.release_tag }}
        run: |
          if [ -z "$DEPLOY_HOST" ]; then
            echo "STAGING DEPLOY_HOST secret is not configured yet — skipping remote SSH deploy."
            exit 0
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          scp -i ~/.ssh/deploy_key deploy/compose.deploy.yaml deploy/Caddyfile deploy/release.sh \
            "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_DIR}/deploy/"
          ssh -i ~/.ssh/deploy_key "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "chmod +x '${DEPLOY_DIR}/deploy/release.sh' && '${DEPLOY_DIR}/deploy/release.sh' '${RELEASE_ACTION}' staging '${RELEASE_TAG}'"

  deploy-production:
    needs: verify-and-build
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'production'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Deploy or rollback production over SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_DIR: ${{ secrets.DEPLOY_DIR }}
          RELEASE_ACTION: ${{ inputs.action || 'deploy' }}
          RELEASE_TAG: ${{ needs.verify-and-build.outputs.release_tag }}
        run: |
          if [ -z "$DEPLOY_HOST" ]; then
            echo "PRODUCTION DEPLOY_HOST secret is not configured yet." >&2
            exit 1
          fi
          if [ -z "${{ inputs.release_tag }}" ]; then
            echo "Production deploy/rollback requires an explicit staging-verified release_tag." >&2
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          scp -i ~/.ssh/deploy_key deploy/compose.deploy.yaml deploy/Caddyfile deploy/release.sh \
            "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_DIR}/deploy/"
          ssh -i ~/.ssh/deploy_key "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "chmod +x '${DEPLOY_DIR}/deploy/release.sh' && '${DEPLOY_DIR}/deploy/release.sh' '${RELEASE_ACTION}' production '${RELEASE_TAG}'"
