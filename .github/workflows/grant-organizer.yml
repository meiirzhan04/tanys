name: Grant Organizer

on:
  workflow_dispatch:
    inputs:
      username:
        description: Registered username or verified email to grant organizer rights
        required: true
        type: string

permissions:
  contents: read

jobs:
  grant:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      TARGET_LOGIN: ${{ inputs.username }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install Vercel CLI
        run: npm install --global vercel@latest
      - name: Pull production environment
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Build API
        working-directory: server
        run: npm ci --no-audit --no-fund && npm run build
      - name: Grant organizer permission
        run: |
          node -e '
            const fs = require("node:fs");
            const { execFileSync } = require("node:child_process");
            const login = (process.env.TARGET_LOGIN || "").trim().toLowerCase();
            if (!login) throw new Error("username input is required");
            const raw = fs.readFileSync(".vercel/.env.production.local", "utf8");
            const env = { ...process.env };
            for (const line of raw.split(/\r?\n/)) {
              const m = line.match(/^([A-Z0-9_]+)=(.*)$/);
              if (!m) continue;
              let v = m[2].trim();
              if ((v.startsWith("\"") && v.endsWith("\"")) || (v.startsWith("\x27") && v.endsWith("\x27"))) v = v.slice(1, -1);
              env[m[1]] = v;
            }
            const dbUrl = env.DATABASE_URL_UNPOOLED || env.DATABASE_URL;
            if (!dbUrl) throw new Error("Production DATABASE_URL is not configured");
            execFileSync("node", ["server/dist/grant-organizer.js", login], { stdio: "inherit", env: { ...env, DATABASE_URL: dbUrl } });
          '
