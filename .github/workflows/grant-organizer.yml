name: Grant Organizer

on:
  workflow_dispatch:
    inputs:
      username:
        description: Registered username or verified email to grant organizer rights
        required: true
        type: string

permissions:
  contents: read

jobs:
  grant:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      TARGET_LOGIN: ${{ inputs.username }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install Vercel CLI
        run: npm install --global vercel@latest
      - name: Grant organizer permission
        run: |
          LOGIN="$(printf '%s' "$TARGET_LOGIN" | tr '[:upper:]' '[:lower:]' | xargs)"
          if [ -z "$LOGIN" ]; then
            echo "username input is required" >&2
            exit 1
          fi
          vercel deploy --prod --yes --build-env "ORGANIZER_LOGIN=$LOGIN" --token="$VERCEL_TOKEN"
