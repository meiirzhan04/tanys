name: tanys-${APP_ENV:?APP_ENV must be staging or production}

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    image: ghcr.io/${IMAGE_REPO:?IMAGE_REPO is required}-api:${RELEASE_TAG:?RELEASE_TAG is required}
    command: ["node", "dist/migrate.js"]
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:?POSTGRES_USER is required}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      PGDATABASE: ${POSTGRES_DB:?POSTGRES_DB is required}
    networks:
      - internal
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    image: ghcr.io/${IMAGE_REPO:?IMAGE_REPO is required}-api:${RELEASE_TAG:?RELEASE_TAG is required}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      APP_ENV: ${APP_ENV:?APP_ENV is required}
      PORT: "3000"
      APP_ORIGIN: https://${APP_DOMAIN:?APP_DOMAIN is required}
      PGHOST: db
      PGUSER: ${POSTGRES_USER:?POSTGRES_USER is required}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      PGDATABASE: ${POSTGRES_DB:?POSTGRES_DB is required}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
      SMTP_URL: ${SMTP_URL:?SMTP_URL is required}
      MAIL_FROM: ${MAIL_FROM:?MAIL_FROM is required}
    networks:
      - internal
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ready >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6

  web:
    image: ghcr.io/${IMAGE_REPO:?IMAGE_REPO is required}-web:${RELEASE_TAG:?RELEASE_TAG is required}
    restart: unless-stopped
    networks:
      - internal

  proxy:
    image: caddy:2.9-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?APP_DOMAIN is required}
      TLS_EMAIL: ${TLS_EMAIL:?TLS_EMAIL is required}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - internal
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started

networks:
  internal:
    driver: bridge

volumes:
  db_data:
  caddy_data:
  caddy_config:
